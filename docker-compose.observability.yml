# Run alongside the existing compose file, don't replace it:
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up --build
#
# Kept as a SEPARATE file on purpose — this is Story 4's full observability
# slice: logs + AI analysis (loki, promtail, log-ai-service) AND metrics +
# dashboards (prometheus, grafana). It's all one file because it's all one
# team's scope (Story 4), so there's nothing to merge-conflict with Stories
# 1-3, who never touch this file. If a *different* team ever adds its own
# signal later, they can still add their own docker-compose.<theirs>.yml and
# stack one more -f flag on top, instead of editing this one.
#
# See observability-decision.md for why this is Prometheus+Grafana and not
# the fuller OpenTelemetry+Tempo+Mimir stack — short version: it would spin
# up a second, redundant Loki next to the one already running below, and
# tracing isn't part of Story 4's Definition of Done.
#
# No top-level `networks:` block here on purpose — `singko-network` is
# already defined in docker-compose.yml, and Compose merges the two files
# into one config when you pass both with -f, so referencing it by name
# below is enough.

services:

  loki:
    image: grafana/loki:3.3.2
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./observability/loki-config.yml:/etc/loki/local-config.yaml:ro
    ports:
      - "3100:3100"   # optional — lets you curl Loki from the host for debugging
    networks:
      - singko-network

  promtail:
    image: grafana/promtail:3.3.2
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    networks:
      - singko-network
    # NOTE (Windows/Docker Desktop): this bind-mount pattern is the standard
    # Promtail recipe and works through Docker Desktop's VM on Windows/Mac in
    # the vast majority of setups. If `docker compose logs promtail` shows it
    # discovering zero targets, that mount is the first thing to check.

  log-ai-service:
    build: ./log-ai-service
    ports:
      - "8085:8085"
    environment:
      LOKI_URL: http://loki:3100
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # Optional overrides — uncomment to change the defaults baked into
      # log-ai-service/src/main/resources/application.yaml:
      # GEMINI_MODEL: gemini-2.5-flash
      # SUMMARY_INTERVAL_MS: "120000"
      # SUMMARY_LOOKBACK_MINUTES: "5"
    depends_on:
      - loki
    networks:
      - singko-network

  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"   # optional — Prometheus's own UI, handy for sanity-checking targets
    networks:
      - singko-network
    # NOTE: Prometheus starts fine even if a target (e.g. account-service)
    # isn't up yet — it just marks that target "down" until the service
    # registers. No `depends_on` needed for the 5 Java services here.

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"   # Grafana UI — http://localhost:3000
    environment:
      # Local demo only — do not reuse these credentials anywhere real.
      # Override via a .env entry (GRAFANA_ADMIN_USER / GRAFANA_ADMIN_PASSWORD)
      # if you want something other than the admin/admin default.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      # Provisioning files are read once on container start and turned into
      # datasources/dashboards automatically — see the comments inside each
      # file under observability/grafana/provisioning/ for how that works.
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - singko-network
